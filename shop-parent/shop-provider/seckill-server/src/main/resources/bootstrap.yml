spring:
  application:
    name: seckill-service
  cloud:
    nacos:
      config:
        server-addr: localhost:8848 #nacos中心地址
        file-extension: yaml # 配置文件格式
        shared-configs:
          - data-id: redis-config-dev.yaml
          - data-id: rocketmq-config-dev.yaml
          - data-id: nacos-discovery-config-dev.yaml
        namespace:  shop-flashsale
  profiles:
    active: dev # 环境标识

seata:
  registry:
    type: nacos
    nacos:
      server-addr: ${spring.cloud.nacos.config.server-addr}
      group: SEATA_GROUP
      namespace: shop-flashsale
      application: seata-server
  service:
    vgroup-mapping:
      seckill-service-group: default
  tx-service-group: seckill-service-group



